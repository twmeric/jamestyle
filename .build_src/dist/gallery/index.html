<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿占隨意語錄典藏 | JameStyle</title>
<meta name="description" content="收錄阿占隨意經典語錄，每一句都係生活嘅解藥。">
<meta property="og:title" content="阿占隨意語錄典藏 | JameStyle">
<meta property="og:description" content="收錄阿占隨意經典語錄，每一句都係生活嘅解藥。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jamestyle.com/gallery/">
<meta property="og:image" content="https://jamestyle.com/gallery-images/9fz0.jpeg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F2ED;
    --ink: #2a2a2a;
    --ink-light: #4a4a4a;
    --matte: rgba(250,248,245,0.92);
    --matte-solid: #FAF8F5;
    --matte-warm: #FFF9F0;
    --accent: #FF6600;
    --accent-light: #FF8533;
    --accent-dark: #E55A00;
    --hermes: #FF6600;
    --hermes-dark: #E55A00;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
  }
  /* Wallpaper background with subtle overlay for readability */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: url('/images/gallery-wall.png') center center / cover no-repeat;
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(245,242,237,0.55);
    z-index: -1;
    backdrop-filter: blur(1px);
  }

  /* ================= Password Overlay ================= */
  .password-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 16, 0.88);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .password-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .password-card {
    background: var(--matte-solid);
    border-radius: 4px;
    max-width: 420px;
    width: 100%;
    padding: 3rem 2.5rem;
    text-align: center;
    box-shadow: 0 24px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
  }
  .password-card::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: var(--accent);
  }
  .password-card h2 {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
    color: var(--ink);
  }
  .password-card .subtitle {
    font-size: 0.85rem;
    color: var(--ink-light);
    letter-spacing: 0.1em;
    margin-bottom: 2rem;
    font-weight: 300;
  }
  .password-card input {
    width: 100%;
    padding: 1rem 1.2rem;
    border: 1.5px solid rgba(0,0,0,0.1);
    border-radius: 8px;
    background: #fff;
    font-family: inherit;
    font-size: 1.1rem;
    text-align: center;
    letter-spacing: 0.3em;
    color: var(--ink);
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    margin-bottom: 1rem;
  }
  .password-card input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(255,102,0,0.12);
  }
  .password-card .btn-submit {
    width: 100%;
    padding: 0.9rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    box-shadow: 0 4px 16px rgba(255,102,0,0.3);
  }
  .password-card .btn-submit:hover {
    background: var(--accent-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(255,102,0,0.35);
  }
  .password-card .error-msg {
    color: #c0392b;
    font-size: 0.8rem;
    margin-top: 0.75rem;
    min-height: 1.2rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .password-card .error-msg.show {
    opacity: 1;
  }
  .password-card.shake {
    animation: shake 0.5s cubic-bezier(0.36,0.07,0.19,0.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  /* Header */
  .header {
    text-align: center;
    padding: 3.5rem 1.5rem 2rem;
    position: relative;
  }
  .header::after {
    content: '';
    display: block;
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: 1.5rem auto 0;
    opacity: 0.5;
  }
  .header h1 {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 0.5rem;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  .header .subtitle {
    font-size: clamp(0.9rem, 2.5vw, 1.1rem);
    color: var(--ink-light);
    font-weight: 300;
    letter-spacing: 0.15em;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  .header .count {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.3rem 1rem;
    border: 1px solid var(--accent);
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    background: rgba(255,255,255,0.6);
  }

  /* Search */
  .search-wrap {
    max-width: 500px;
    margin: 0 auto 2rem;
    padding: 0 1.5rem;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 0.85rem 1.2rem 0.85rem 2.8rem;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 12px;
    background: var(--matte);
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(4px);
  }
  .search-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,102,0,0.12);
  }
  .search-wrap .search-icon {
    position: absolute;
    left: 2.2rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-light);
    opacity: 0.5;
    font-size: 1rem;
  }

  /* Gallery Grid */
  .gallery {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.2rem;
  }
  @media(min-width: 640px) { .gallery { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; } }
  @media(min-width: 1024px) { .gallery { grid-template-columns: repeat(4, 1fr); gap: 2rem; padding: 0 2.5rem 5rem; } }
  @media(min-width: 1400px) { .gallery { grid-template-columns: repeat(5, 1fr); } }

  /* Card */
  .card {
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.4s;
    border-radius: 4px;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.12);
  }
  .card-frame {
    position: relative;
    background: var(--matte-solid);
    padding: 8px;
    border-radius: 2px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .card-img-wrap {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    overflow: hidden;
    background: #f0ece6;
  }
  .card-img-wrap img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
  }
  .card:hover .card-img-wrap img {
    transform: scale(1.05);
  }
  .card-info {
    padding: 0.9rem 0.4rem 0.3rem;
  }
  .card-num {
    font-size: 0.65rem;
    color: var(--accent);
    letter-spacing: 0.15em;
    font-weight: 500;
    margin-bottom: 0.2rem;
  }
  .card-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.4;
    margin-bottom: 0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-caption {
    font-size: 0.78rem;
    color: var(--ink-light);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    opacity: 0.8;
  }

  /* ================= Modal (Gallery Mode) ================= */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(245,242,237,0.92);
    backdrop-filter: blur(12px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s, visibility 0.4s;
  }
  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }
  .modal-content {
    background: var(--matte-solid);
    border-radius: 6px;
    max-width: 880px;
    width: 100%;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    transform: scale(0.95) translateY(16px);
    transition: transform 0.35s ease-out;
    position: relative;
  }
  .modal-overlay.active .modal-content {
    transform: scale(1) translateY(0);
  }
  .modal-close {
    position: absolute;
    top: 0.8rem;
    right: 0.8rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.85);
    cursor: pointer;
    font-size: 1.2rem;
    color: var(--ink);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: #fff; }
  .modal-body {
    display: flex;
    flex-direction: column;
  }
  @media(min-width: 768px) {
    .modal-body { flex-direction: row; }
  }
  .modal-img-side {
    flex: 1;
    min-height: 300px;
    position: relative;
    background: #f0ece6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .modal-img-side img {
    max-width: 100%;
    max-height: 70vh;
    object-fit: contain;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
  }
  .modal-text-side {
    flex: 1;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  @media(min-width: 768px) {
    .modal-text-side { padding: 2.5rem; }
  }
  .modal-num {
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 0.8rem;
    font-weight: 500;
  }
  .modal-title {
    font-family: 'Noto Serif TC', serif;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 1.2rem;
    line-height: 1.3;
  }
  .modal-caption {
    font-size: 1.05rem;
    line-height: 1.8;
    color: var(--ink);
    margin-bottom: 1.2rem;
    padding: 1rem 0;
    font-weight: 400;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  /* Insight reveal button */
  .insight-reveal {
    margin-bottom: 1.2rem;
  }
  .btn-insight {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 1.4rem;
    border-radius: 8px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s;
    letter-spacing: 0.05em;
  }
  .btn-insight:hover {
    background: var(--accent);
    color: #fff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(255,102,0,0.25);
  }
  .btn-insight .arrow {
    transition: transform 0.3s;
    display: inline-block;
  }
  .btn-insight.open .arrow {
    transform: rotate(180deg);
  }
  .insight-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.5s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.4s, padding 0.4s;
    opacity: 0;
  }
  .insight-content.open {
    max-height: 500px;
    opacity: 1;
    padding-top: 1rem;
  }
  .modal-insight-label {
    font-size: 0.7rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    margin-bottom: 0.5rem;
    font-weight: 500;
    text-transform: uppercase;
  }
  .modal-insight {
    font-size: 0.95rem;
    line-height: 1.9;
    color: var(--ink-light);
  }

  /* Actions */
  .modal-actions {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding-top: 1rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.5rem 0.9rem;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.08);
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.82rem;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .btn:hover {
    border-color: var(--accent);
    background: rgba(255,102,0,0.06);
  }
  .btn-primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .btn-primary:hover {
    background: #3a3a3a;
    border-color: #3a3a3a;
  }
  .btn-hermes {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(255,102,0,0.2);
  }
  .btn-hermes:hover {
    background: var(--accent-light);
    border-color: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(255,102,0,0.3);
  }
  .btn-reaction {
    font-size: 1.1rem;
    padding: 0.5rem 0.8rem;
  }
  .btn-reaction .count {
    font-size: 0.75rem;
    color: var(--ink-light);
    margin-left: 0.2rem;
  }

  /* Nav arrows in modal */
  .modal-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.85);
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: all 0.2s;
    z-index: 10;
  }
  .modal-nav:hover { background: #fff; }
  .modal-nav.prev { left: 0.5rem; }
  .modal-nav.next { right: 0.5rem; }
  @media(min-width: 768px) {
    .modal-nav.prev { left: -18px; }
    .modal-nav.next { right: -18px; }
  }

  /* Music player */
  .music-player {
    position: fixed;
    bottom: 1.2rem;
    right: 1.2rem;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--matte);
    border-radius: 50px;
    padding: 0.5rem 0.9rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border: 1px solid rgba(0,0,0,0.05);
    backdrop-filter: blur(8px);
    transition: all 0.2s;
  }
  .music-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.9rem;
    transition: all 0.3s;
  }
  .music-btn:hover {
    background: var(--accent-light);
    transform: scale(1.1);
  }
  .music-label {
    font-size: 0.75rem;
    color: var(--ink-light);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .music-waves {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 16px;
  }
  .music-waves span {
    display: block;
    width: 2px;
    background: var(--accent);
    border-radius: 1px;
    animation: wave 1s ease-in-out infinite;
  }
  .music-waves span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .music-waves span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
  .music-waves span:nth-child(3) { height: 8px; animation-delay: 0.3s; }
  .music-waves span:nth-child(4) { height: 14px; animation-delay: 0.1s; }
  .music-waves.paused span {
    animation-play-state: paused;
    height: 3px !important;
    opacity: 0.4;
    transition: height 0.3s;
  }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.6); }
    50% { transform: scaleY(1); }
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--ink-light);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    grid-column: 1 / -1;
  }
  .loading::after {
    content: '';
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid var(--accent);
    border-top-color: transparent;
    border-radius: 50%;
    margin-left: 0.5rem;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* No results */
  .no-results {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--ink-light);
    grid-column: 1 / -1;
  }

  /* Footer */
  footer {
    text-align: center;
    padding: 2rem 1rem 3rem;
    color: var(--ink-light);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
  }
  footer p {
    opacity: 0.6;
  }
  footer .footer-powered {
    opacity: 1;
    margin-top: 0.5rem;
    font-size: 0.75rem;
  }
  footer .jkdcoding {
    color: #CCFF00;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(204, 255, 0, 0.5), 0 0 20px rgba(204, 255, 0, 0.2);
    letter-spacing: 0.05em;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Fade in animation */
  .fade-in {
    animation: fadeIn 0.6s ease-out forwards;
    opacity: 0;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  /* Scrollbar */
  .modal-content::-webkit-scrollbar { width: 6px; }
  .modal-content::-webkit-scrollbar-track { background: transparent; }
  .modal-content::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 5rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--matte-solid);
    padding: 0.8rem 1.5rem;
    border-radius: 8px;
    font-size: 0.85rem;
    z-index: 200;
    opacity: 0;
    transition: all 0.4s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ================= Single View Mode ================= */
  .single-view {
    display: none;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    /* Gallery wall texture */
    background:
      radial-gradient(ellipse at 25% 30%, rgba(255,255,255,0.5) 0%, transparent 40%),
      radial-gradient(ellipse at 75% 70%, rgba(0,0,0,0.04) 0%, transparent 35%),
      linear-gradient(180deg, #E6E2DA 0%, #DDD8D0 40%, #E2DED6 100%);
    position: relative;
  }
  .single-view::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;

  /* 3D Flip Card - only the artwork flips */

  .flip-card-inner {

  .flip-card.flipped .flip-card-inner {

  /* Frame styles for single mode */
  /* Wall shadow for hanging effect */
  .frame-wrap {

  }
  .frame-wrap::after {
    content: '';

  /* 3D frame border simulation: top/left lighter, bottom/right darker */
  .frame-style-0 { /* Classic Walnut */

  .frame-style-2 { /* Matte Black */

  .frame-style-3 { /* Aged Copper */

  .frame-style-4 .frame-matting { padding: 14px; }
  .frame-style-5 { /* Leather Brown */

    border-top-color: #5A4738;
    border-left-color: #5A4738;
    border-bottom-color: #3A2718;
    border-right-color: #3A2718;

  .frame-style-6 { /* Polished Silver */

  }
  .frame-style-6 .frame-matting { padding: 10px; }
  .frame-style-7 { /* Ivory Carved */
    border: 14px solid #FFFFF0;
    border-top-color: #FFFFFF;
    border-left-color: #FFFFFF;
    border-bottom-color: #F0ECD8;
    border-right-color: #F0ECD8;
    box-shadow: inset 0 0 0 2px #F0E68C, 0 12px 35px rgba(0,0,0,0.1), inset 2px 2px 4px rgba(255,255,255,0.6);

  .frame-style-7 .frame-matting { padding: 12px; }
  .frame-style-8 { /* Industrial Iron */
    border: 6px solid #2F4F4F;
    border-top-color: #3D6363;
    border-left-color: #3D6363;
    border-bottom-color: #1F3F3F;

    box-shadow: inset 0 0 0 2px #4A6464, 0 10px 30px rgba(0,0,0,0.22), inset 1px 1px 2px rgba(255,255,255,0.1);
    border-radius: 1px;
  }
  .frame-style-8 .frame-matting { padding: 10px; }
  .frame-style-9 { /* Floating Minimal */
    border: none;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 2px 8px rgba(0,0,0,0.08);
    border-radius: 4px;
  }
  .frame-style-9 .frame-matting { padding: 16px; }

  .single-frame-img {

<body>

<!-- Password Overlay -->
<div class="password-overlay" id="passwordOverlay">

<header class="header" id="galleryHeader">

<div class="search-wrap" id="gallerySearch">

  <input type="text" id="searchInput" placeholder="搜尋語錄、標題..." autocomplete="off">

<main class="gallery" id="gallery">
  <div class="loading">正在整理畫廊</div>

<!-- Single View (3D Flip Card) -->
<div class="single-view" id="singleView">
  <div class="single-card-wrap" id="singleCardWrap">
    <div class="flip-card" id="flipCard">
      <div class="flip-card-inner" id="flipCardInner">
        <!-- Front -->
        <div class="flip-card-front" id="flipCardFront"></div>
        <!-- Back -->
        <div class="flip-card-back" id="flipCardBack"></div>

<!-- Modal (Gallery Mode) -->
<div class="modal-overlay" id="modal">
  <button class="modal-close" id="modalClose">&times;</button>
  <button class="modal-nav prev" id="modalPrev">&#10094;</button>
  <button class="modal-nav next" id="modalNext">&#10095;</button>
  <div class="modal-content" id="modalContent">
    <div class="modal-body" id="modalBody"></div>

<!-- Music Player -->
<div class="music-player" id="musicPlayer">
  <button class="music-btn" id="musicBtn" title="播放/暫停">&#9654;</button>
  <div class="music-waves paused" id="musicWaves">
    <span></span><span></span><span></span><span></span>
  </div>
  <span class="music-label">Canon</span>
</div>

<div class="toast" id="toast"></div>

<footer id="galleryFooter">
  <p>&copy; 2026 JameStyle | <a href="/" target="_top">返回主站</a></p>
  <p class="footer-powered">Powered by <span class="jkdcoding">JKDCoding</span></p>
</footer>

<script>
  const BASE = '/';
  const API_BASE = 'https://jamestyle-analytics.jimsbond007.workers.dev';
  let galleryData = [];
  let displayedData = [];   // currently visible items (filtered or full)
  let currentIndex = 0;
  let isInsightOpen = false;
  let autoFlipTimeout = null;
  const todayInsightCache = new Map();
  let reactionCounts = {};
  let userReactions = JSON.parse(localStorage.getItem('gallery_user_reactions') || '{}');

  function getSessionId() {
    let id = localStorage.getItem('gallery_session_id');
    if (!id) {
      id = 'gs_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('gallery_session_id', id);
    }
    return id;
  }
  const sessionId = getSessionId();

  const REACTION_TYPES = [
    { key: 'like', emoji: '👍', label: '讚好' },
    { key: 'love', emoji: '❤️', label: '喜歡' },
    { key: 'laugh', emoji: '😂', label: '好笑' },
    { key: 'sad', emoji: '😢', label: '感動' }
  ];

  // ================= Mode Detection =================
  const urlParams = new URLSearchParams(window.location.search);
  const singleCode = urlParams.get('code');
  const isSingleMode = !!singleCode;

  if (isSingleMode) {
    document.body.classList.add('single-mode');
  }

  // ================= Frame Styles =================
  const FRAME_STYLES = [
    { name: 'Classic Walnut', class: 'frame-style-0' },
    { name: 'Gold Slim', class: 'frame-style-1' },
    { name: 'Matte Black', class: 'frame-style-2' },
    { name: 'Aged Copper', class: 'frame-style-3' },
    { name: 'Gallery White', class: 'frame-style-4' },
    { name: 'Leather Brown', class: 'frame-style-5' },
    { name: 'Polished Silver', class: 'frame-style-6' },
    { name: 'Ivory Carved', class: 'frame-style-7' },
    { name: 'Industrial Iron', class: 'frame-style-8' },
    { name: 'Floating Minimal', class: 'frame-style-9' }
  ];

  function hashCode(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
      const char = str.charCodeAt(i);
      hash = ((hash << 5) - hash) + char;
      hash = hash & hash;
    }
    return Math.abs(hash);
  }

  function getFrameClass(code) {
    const idx = hashCode(code) % FRAME_STYLES.length;
    return FRAME_STYLES[idx].class;
  }

  // ================= Music =================
  const audio = new Audio('/music/gallery.mp3');
  audio.loop = true;
  audio.volume = 0.25;
  audio.playbackRate = 0.85;
  let isPlaying = false;

  const musicBtn = document.getElementById('musicBtn');
  const musicWaves = document.getElementById('musicWaves');

  function toggleMusic() {
    if (isPlaying) {
      audio.pause();
      musicBtn.innerHTML = '&#9654;';
      musicWaves.classList.add('paused');
    } else {
      audio.play().catch(() => {});
      musicBtn.innerHTML = '&#10074;&#10074;';
      musicWaves.classList.remove('paused');
    }
    isPlaying = !isPlaying;
  }

  musicBtn.addEventListener('click', toggleMusic);

  // Auto-play music on first user interaction
  const musicInit = () => {
    if (!isPlaying && !isSingleMode) toggleMusic();
    ['click', 'touchstart', 'keydown'].forEach(e => document.removeEventListener(e, musicInit));
  };
  ['click', 'touchstart', 'keydown'].forEach(e => document.addEventListener(e, musicInit, { once: true, passive: true }));

  // ================= Password =================
  const passwordOverlay = document.getElementById('passwordOverlay');
  const passwordCard = document.getElementById('passwordCard');
  const passwordInput = document.getElementById('passwordInput');
  const passwordSubmit = document.getElementById('passwordSubmit');
  const passwordError = document.getElementById('passwordError');

  function showPasswordError() {
    passwordError.classList.add('show');
    passwordCard.classList.remove('shake');
    void passwordCard.offsetWidth; // reflow
    passwordCard.classList.add('shake');
    passwordInput.value = '';
    passwordInput.focus();
  }

  function unlockGallery() {
    passwordOverlay.classList.add('hidden');
    sessionStorage.setItem('gallery_unlocked', '1');
  }

  function checkPassword() {
    const val = passwordInput.value.trim();
    if (val === '4453') {
      unlockGallery();
    } else {
      showPasswordError();
    }
  }

  passwordSubmit.addEventListener('click', checkPassword);
  passwordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
    passwordError.classList.remove('show');
  });

  // ================= API Helpers =================
  async function fetchTodayInsight(code) {
    if (todayInsightCache.has(code)) return todayInsightCache.get(code);
    try {
      const res = await fetch(`${API_BASE}/api/public/quote/${encodeURIComponent(code)}/today`);
      if (!res.ok) throw new Error('fail');
      const data = await res.json();
      const insight = data?.todayInsight || null;
      todayInsightCache.set(code, insight);
      return insight;
    } catch (e) {
      return null;
    }
  }

  async function fetchReactions(code) {
    try {
      const res = await fetch(`${API_BASE}/api/public/quote/${encodeURIComponent(code)}/reactions`);
      if (!res.ok) throw new Error('fail');
      const data = await res.json();
      if (data && data.counts) {
        reactionCounts[code] = data.counts;
      }
      return data;
    } catch (e) {
      return null;
    }
  }

  async function postReaction(code, type) {
    try {
      await fetch(`${API_BASE}/api/public/quote/${encodeURIComponent(code)}/react`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reactionType: type, sessionId })
      });
    } catch (e) {}
  }

  async function trackEvent(eventType, code, extraData) {
    try {
      await fetch(`${API_BASE}/api/public/events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId,
          eventType,
          slideId: null,
          eventData: extraData ? JSON.stringify(extraData) : JSON.stringify({ code }),
          durationMs: null
        })
      });
    } catch (e) {}
  }

  async function requestSubscribe(code) {
    try {
      const res = await fetch(`${API_BASE}/api/public/subscribe/request`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code, sessionId })
      });
      if (!res.ok) throw new Error('fail');
      return await res.json();
    } catch (e) {
      return null;
    }
  }

  function renderReactionButtons(code) {
    const counts = reactionCounts[code] || {};
    const user = userReactions[code] || {};
    return REACTION_TYPES.map(t => {
      const count = counts[t.key] || 0;
      const active = user[t.key];
      return `<button class="btn btn-reaction ${active ? 'active' : ''}" data-type="${t.key}" title="${t.label}">
        ${t.emoji} <span class="count">${count}</span>
      </button>`;
    }).join('');
  }

  function bindReactionButtons(code, container) {
    container.querySelectorAll('.btn-reaction[data-type]').forEach(btn => {
      btn.addEventListener('click', () => toggleReaction(code, btn.dataset.type));
    });
  }

  async function toggleReaction(code, type) {
    if (!userReactions[code]) userReactions[code] = {};
    if (!reactionCounts[code]) reactionCounts[code] = {};
    const active = !!userReactions[code][type];
    if (active) {
      reactionCounts[code][type] = Math.max(0, (reactionCounts[code][type] || 0) - 1);
      delete userReactions[code][type];
    } else {
      reactionCounts[code][type] = (reactionCounts[code][type] || 0) + 1;
      userReactions[code][type] = true;
    }
    localStorage.setItem('gallery_user_reactions', JSON.stringify(userReactions));
    postReaction(code, type);
    updateReactionCountsInUI(code);
  }

  function updateReactionCountsInUI(code) {
    const counts = reactionCounts[code] || {};
    const user = userReactions[code] || {};
    document.querySelectorAll('.btn-reaction[data-type]').forEach(btn => {
      const type = btn.dataset.type;
      const countEl = btn.querySelector('.count');
      if (countEl) countEl.textContent = counts[type] || 0;
      btn.classList.toggle('active', !!user[type]);
    });
  }

  async function handleSubscribe(code) {
    const data = await requestSubscribe(code);
    if (data && data.deepLink) {
      window.open(data.deepLink, '_blank');
      showToast('已為您準備好訂閱訊息！');
    } else {
      showToast('暫時無法處理，請稍後再試');
    }
  }

  function handleWhatsApp(item) {
    trackEvent('whatsapp_share', item.code, { title: item.title, platform: 'whatsapp' });
    const text = encodeURIComponent(item.caption + '\n\n— 阿占隨意《' + item.title + '》\nhttps://jamestyle.com/?code=' + item.code);
    window.open('https://wa.me/?text=' + text, '_blank');
  }

  function trackPageView(code, source) {
    trackEvent('page_view', code, { source: source || 'gallery' });
  }

  // ================= Load Data =================
  async function loadGallery() {
    try {
      const res = await fetch(BASE + 'gallery-data.json');
      const data = await res.json();
      galleryData = data.gallery || [];
      document.getElementById('countBadge').textContent = galleryData.length + ' 則語錄';

      if (isSingleMode) {
        const item = galleryData.find(i => i.code === singleCode);
        if (item) {
          openSingleView(item);
        } else {
          document.getElementById('singleView').innerHTML = '<div style="text-align:center;color:var(--ink-light);padding:4rem 1rem;">找不到此語錄</div>';
          document.getElementById('singleView').classList.add('active');
        }
      } else {
        // Gallery mode: check if already unlocked this session
        if (sessionStorage.getItem('gallery_unlocked') === '1') {
          unlockGallery();
        }
        renderGallery(galleryData);
      }
    } catch (e) {
      if (isSingleMode) {
        document.getElementById('singleView').innerHTML = '<div style="text-align:center;color:var(--ink-light);padding:4rem 1rem;">載入失敗</div>';
        document.getElementById('singleView').classList.add('active');
      } else {
        document.getElementById('gallery').innerHTML = '<div class="no-results">載入失敗，請稍後再試</div>';
      }
    }
  }

  function getImageUrl(code) {
    return BASE + 'gallery-images/' + code + '.jpeg';
  }
  function getWebpUrl(code) {
    return BASE + 'gallery-images-webp/' + code + '.webp';
  }
  function renderPicture(code, title, lazy) {
    return `<picture>
      <source srcset="${getWebpUrl(code)}" type="image/webp">
      <img src="${getImageUrl(code)}" alt="${title}"${lazy ? ' loading="lazy"' : ''}>
    </picture>`;
  }

  function renderGallery(items) {
    displayedData = items;   // track current visible set for modal navigation
    const container = document.getElementById('gallery');
    if (items.length === 0) {
      container.innerHTML = '<div class="no-results">找不到相關語錄</div>';
      return;
    }
    container.innerHTML = items.map((item, i) => `
      <article class="card fade-in" style="animation-delay:${Math.min(i*0.03,0.6)}s" data-index="${i}" data-code="${item.code}">
        <div class="card-frame">
          <div class="card-img-wrap">
            ${renderPicture(item.code, item.title, true)}
          </div>
        </div>
        <div class="card-info">
          <div class="card-num">NO. ${String(item.id).padStart(2,'0')}</div>
          <div class="card-title">${escapeHtml(item.title)}</div>
          <div class="card-caption">${escapeHtml(item.caption)}</div>
        </div>
      </article>
    `).join('');

    container.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.index);
        openModal(idx);
      });
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ================= Modal (Gallery Mode) =================
  function openModal(index) {
    currentIndex = index;
    isInsightOpen = false;
    const item = displayedData[index];
    trackPageView(item.code, 'modal');
    const body = document.getElementById('modalBody');

    body.innerHTML = `
      <div class="modal-img-side">
        ${renderPicture(item.code, item.title, false)}
      </div>
      <div class="modal-text-side">
        <div class="modal-num">NO. ${String(item.id).padStart(2,'0')} / ${galleryData.length}</div>
        <h2 class="modal-title">${escapeHtml(item.title)}</h2>
        <blockquote class="modal-caption">${escapeHtml(item.caption)}</blockquote>
        <div class="insight-reveal">
          <button class="btn-insight" id="btnInsight">
            <span>&#10024;</span> 解畫 <span class="arrow" id="insightArrow">&#9660;</span>
          </button>
          <div class="insight-content" id="insightContent">
            <div class="modal-insight-label" id="modalInsightLabel">阿占隨意 · 解畫</div>
            <div id="modalInsightLoading" style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0;color:var(--ink-light);font-size:0.9rem;">
              <span class="spinner-inline"></span> 正在獲取今日解畫...
            </div>
            <p class="modal-insight" id="modalInsightText" style="display:none;"></p>
          </div>
        </div>
        <div class="modal-actions" id="modalActions">
          ${renderReactionButtons(item.code)}
          <button class="btn btn-hermes" id="btnSubscribe">&#127873; 獲取驚喜</button>
          <button class="btn btn-whatsapp" id="btnWhatsApp">&#128172; WhatsApp</button>
        </div>
      </div>
    `;

    document.getElementById('modal').classList.add('active');
    document.body.style.overflow = 'hidden';
    history.pushState({gallery: true, code: item.code}, '', '/gallery/?code=' + item.code);

    // Bind actions
    document.getElementById('btnInsight').addEventListener('click', toggleInsight);
    bindReactionButtons(item.code, document.getElementById('modalActions'));
    document.getElementById('btnSubscribe').addEventListener('click', () => handleSubscribe(item.code));
    document.getElementById('btnWhatsApp').addEventListener('click', () => handleWhatsApp(item));

    // Fetch today insight
    fetchTodayInsight(item.code).then(todayInsight => {
      const loading = document.getElementById('modalInsightLoading');
      const text = document.getElementById('modalInsightText');
      const label = document.getElementById('modalInsightLabel');
      if (loading) loading.style.display = 'none';
      if (text) {
        text.style.display = '';
        text.textContent = todayInsight || item.insight;
      }
      if (label) {
        label.textContent = todayInsight ? '今日解畫' : '阿占隨意 · 解畫';
      }
    });

    // Fetch reactions
    fetchReactions(item.code).then(() => updateReactionCountsInUI(item.code));
  }

  function toggleInsight() {
    const btn = document.getElementById('btnInsight');
    const content = document.getElementById('insightContent');
    isInsightOpen = !isInsightOpen;
    btn.classList.toggle('open', isInsightOpen);
    content.classList.toggle('open', isInsightOpen);
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
    document.body.style.overflow = '';
    if (history.state && history.state.gallery) {
      history.pushState({}, '', '/gallery/');
    }
  }

  function copyLink(code) {
    const url = 'https://jamestyle.com/?code=' + code;
    navigator.clipboard.writeText(url).then(() => showToast('連結已複製'));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ================= Single View (3D Flip Card) =================
  function openSingleView(item) {
    trackPageView(item.code, isSingleMode ? 'direct_share' : 'gallery');
    document.body.classList.add('single-mode');
    const container = document.getElementById('singleView');
    const flipCard = document.getElementById('flipCard');
    const front = document.getElementById('flipCardFront');
    const back = document.getElementById('flipCardBack');
    const staticContent = document.getElementById('singleStaticContent');
    const frameClass = getFrameClass(item.code);

    // Update meta for single view
    document.title = `阿占隨意語錄 | ${item.title}`;
    const descMeta = document.querySelector('meta[name="description"]');
    if (descMeta) descMeta.content = item.caption;

    // Reset flip state
    flipCard.classList.remove('flipped');
    if (autoFlipTimeout) {
      clearTimeout(autoFlipTimeout);
      autoFlipTimeout = null;
    }

    // Front side - only the artwork
    front.innerHTML = `
      <div class="frame-wrap ${frameClass}">
        <div class="frame-matting">
          ${renderPicture(item.code, item.title, false).replace('<img', '<img class="single-frame-img"')}
        </div>
      </div>
    `;

    // Back side - insight text only
    back.innerHTML = `
      <div class="single-back-label" id="singleInsightLabel">阿占隨意 · 解畫</div>
      <div id="singleInsightLoading" style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0;color:var(--ink-light);font-size:0.95rem;">
        <span class="spinner-inline"></span> 正在獲取今日解畫...
      </div>
      <p class="single-insight" id="singleInsightText" style="display:none;"></p>
    `;

    // Static content - title + insight button row, caption, two rows of actions
    staticContent.innerHTML = `
      <div class="single-header-row">
        <h2 class="single-title">${escapeHtml(item.title)}</h2>
        <button class="btn btn-insight-pill" id="btnFlipToggle">&#10024; 阿占話你知</button>
      </div>
      <blockquote class="single-caption">${escapeHtml(item.caption)}</blockquote>
      <div class="single-actions" id="singleActions">
        ${renderReactionButtons(item.code)}
      </div>
      <div class="single-actions-row2">
        <button class="btn btn-hermes" id="btnSubscribe">&#127873; 獲取驚喜</button>
        <button class="btn btn-whatsapp" id="btnWhatsApp">&#128172; WhatsApp</button>
      </div>
    `;

    container.classList.add('active');

    // Bind flip events
    const btnFlip = document.getElementById('btnFlipToggle');
    btnFlip.addEventListener('click', () => {
      if (flipCard.classList.contains('flipped')) {
        // Currently showing back, flip to front
        flipCard.classList.remove('flipped');
        btnFlip.innerHTML = '&#10024; 阿占話你知';
        if (autoFlipTimeout) {
          clearTimeout(autoFlipTimeout);
          autoFlipTimeout = null;
        }
      } else {
        // Currently showing front, flip to back
        flipCard.classList.add('flipped');
        btnFlip.innerHTML = '&#10094; 返回';
        if (autoFlipTimeout) clearTimeout(autoFlipTimeout);
        autoFlipTimeout = setTimeout(() => {
          flipCard.classList.remove('flipped');
          btnFlip.innerHTML = '&#10024; 阿占話你知';
        }, 5000);
      }
    });

    bindReactionButtons(item.code, document.getElementById('singleActions'));
    document.getElementById('btnSubscribe').addEventListener('click', () => handleSubscribe(item.code));
    document.getElementById('btnWhatsApp').addEventListener('click', () => handleWhatsApp(item));

    // Fetch today insight
    fetchTodayInsight(item.code).then(todayInsight => {
      const loading = document.getElementById('singleInsightLoading');
      const text = document.getElementById('singleInsightText');
      const label = document.getElementById('singleInsightLabel');
      if (loading) loading.style.display = 'none';
      if (text) {
        text.style.display = '';
        text.textContent = todayInsight || item.insight;
      }
      if (label) {
        label.textContent = todayInsight ? '今日解畫' : '阿占隨意 · 解畫';
      }
    });

    // Fetch reactions
    fetchReactions(item.code).then(() => updateReactionCountsInUI(item.code));
  }

  // ================= Search =================
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    if (!q) {
      renderGallery(galleryData);
      return;
    }
    const filtered = galleryData.filter(item =>
      item.title.toLowerCase().includes(q) ||
      item.caption.toLowerCase().includes(q) ||
      item.insight.toLowerCase().includes(q)
    );
    renderGallery(filtered);
  });

  // ================= Modal controls =================
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });
  document.getElementById('modalPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex - 1 + displayedData.length) % displayedData.length;
    openModal(currentIndex);
  });
  document.getElementById('modalNext').addEventListener('click', (e) => {
    e.stopPropagation();
    currentIndex = (currentIndex + 1) % displayedData.length;
    openModal(currentIndex);
  });

  // ================= Keyboard =================
  document.addEventListener('keydown', (e) => {
    if (isSingleMode) return;
    if (!document.getElementById('modal').classList.contains('active')) return;
    if (e.key === 'Escape') closeModal();
    if (e.key === 'ArrowLeft') {
      currentIndex = (currentIndex - 1 + displayedData.length) % displayedData.length;
      openModal(currentIndex);
    }
    if (e.key === 'ArrowRight') {
      currentIndex = (currentIndex + 1) % displayedData.length;
      openModal(currentIndex);
    }
  });

  // ================= Init =================
  loadGallery();
</script>
</body>
</html>
